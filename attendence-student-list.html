<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#245b70">
    <title>Wackha Hajar App</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="style/top-navbar.css">
    <link rel="stylesheet" href="style/bottom-navbar.css">
    <link rel="stylesheet" href="style/general.css">
    <link rel="stylesheet" href="style/attendence-filter.css">
    <link rel="stylesheet" href="style/add-students.css">
    <link rel="icon" type="image/png" href="./icon/attendence-icon-64.png">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="profile-onlinestatus-div">
            <div class="user-info-container">
                <img class="profile-picture" src="images/nooru.jpeg" alt="">
                <div class="signintext-profilename-div">
                    <p class="sign-in-text">Signed In</p>
                    <strong class="profile-name">NOORUDHEEN SAQAFI</strong>
                </div>
            </div>
            <div class="online-text-div">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-wifi" aria-hidden="true">
                    <path d="M12 20h.01"></path>
                    <path d="M2 8.82a15 15 0 0 1 20 0"></path>
                    <path d="M5 12.859a10 10 0 0 1 14 0"></path>
                    <path d="M8.5 16.429a5 5 0 0 1 7 0"></path>
                </svg>
                <p class="online-text">Online</p>
            </div>
        </div>


        <p class="hajar-title">Hajar </p>
        <div class="top-nav-buttons-container">
            <button class="top-nav-buttons active">Attendence</button>
            <button class="top-nav-buttons">Reports</button>
            <button class="top-nav-buttons">Settings</button>
        </div>
    </header>

    <!-- Add Student Tab -->
    <main class="js-main">
        <div>
            <div class="present-absent-allabsent-div">
            <div class="present-div">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-circle-check" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="m9 12 2 2 4-4"></path>
                </svg>
                1 Present
            </div>
            <div class="absent-div">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-circle-x" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="m15 9-6 6"></path>
                    <path d="m9 9 6 6"></path>
                </svg>
                0 Absent
            </div>
            <button>All Absent</button>
        </div>

        <div class="attendence-students-list-grid">
            <!-- Student List -->
            <div class="students-list-attendence-div">
                <img class="attendence-profile-picture" src="images/nooru.jpeg" alt="">
                <p class="attendence-student-name">Badusha</p>
                <div class="present-status-div">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-circle-check" aria-hidden="true">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="m9 12 2 2 4-4"></path>
                    </svg>
                    <p>present</p>
                </div>
            </div>



            <!-- Student List -->
            <div class="students-list-attendence-absent-div">
                <img class="attendence-profile-picture" src="images/nooru.jpeg" alt="">
                <p class="attendence-student-name">Badusha</p>


                <div class="absent-status-div">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-circle-x" aria-hidden="true">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="m15 9-6 6"></path>
                        <path d="m9 9 6 6"></path>
                    </svg>
                    <p>absent</p>
                </div>
            </div>

            <!-- Student List -->
            <div class="students-list-attendence-div">
                <img class="attendence-profile-picture" src="images/nooru.jpeg" alt="">
                <p class="attendence-student-name">Badusha</p>


                <div class="present-status-div">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-circle-check" aria-hidden="true">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="m9 12 2 2 4-4"></path>
                    </svg>
                    <p>present</p>
                </div>
            </div>
            
            <!-- Student List -->
            <div class="students-list-attendence-div">
                <img class="attendence-profile-picture" src="images/nooru.jpeg" alt="">
                <p class="attendence-student-name">Badusha</p>


                <div class="present-status-div">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-circle-check" aria-hidden="true">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="m9 12 2 2 4-4"></path>
                    </svg>
                    <p>present</p>
                </div>
            </div>
            <!-- Student List -->
            <div class="students-list-attendence-div">
                <img class="attendence-profile-picture" src="images/nooru.jpeg" alt="">
                <p class="attendence-student-name">Badusha</p>


                <div class="present-status-div">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-circle-check" aria-hidden="true">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="m9 12 2 2 4-4"></path>
                    </svg>
                    <p>present</p>
                </div>
            </div>
        </div>
        <div class="save-button-div">
            <button class="save-attendence-button">Save Attendence</button>
        </div>
        



    </main>

    <!-- Bottom Navbar -->
    <footer>
        <div class="bottom-navbar-container">
            <button class="bottom-nav-button active">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-user-plus" aria-hidden="true" style="color: var(--text-muted);">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <line x1="19" x2="19" y1="8" y2="14"></line>
                    <line x1="22" x2="16" y1="11" y2="11"></line>
                </svg>
                <p>Students</p>
            </button>
            <button class="bottom-nav-button">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-users" aria-hidden="true" style="color: var(--text-muted);">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                    <path d="M16 3.128a4 4 0 0 1 0 7.744"></path>
                    <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                </svg>
                <p>Teachers</p>
            </button>
            <button class="bottom-nav-button">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-layout-grid" aria-hidden="true" style="color: var(--primary);">
                    <rect width="7" height="7" x="3" y="3" rx="1"></rect>
                    <rect width="7" height="7" x="14" y="3" rx="1"></rect>
                    <rect width="7" height="7" x="14" y="14" rx="1"></rect>
                    <rect width="7" height="7" x="3" y="14" rx="1"></rect>
                </svg>
                <p>Classes</p>
            </button>
            <button class="bottom-nav-button">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-book-open" aria-hidden="true" style="color: var(--text-muted);">
                    <path d="M12 7v14"></path>
                    <path
                        d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z">
                    </path>
                </svg>
                <p>Subjects</p>
            </button>
        </div>
    </footer>




    <script src="./scripts/add-students.js"></script>
    <script src="./scripts.js"></script>
</body>
