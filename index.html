<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#245b70">
    <title>Wackha Hajar App - Attendance Management</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon.png">
    <link rel="icon" type="image/png" sizes="64x64" href="icons/attendence-icon-64.png">
    <link rel="apple-touch-icon" href="icons/attendence-icon-192.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style/top-navbar.css">
    <link rel="stylesheet" href="style/bottom-navbar.css">
    <link rel="stylesheet" href="style/general.css">
    <link rel="stylesheet" href="style/attendence-filter.css">
    <link rel="stylesheet" href="style/report.css">
    <link rel="stylesheet" href="style/settings.css">
    <link rel="stylesheet" href="style/add-students.css">
</head>
<body>
    
<!-- Header -->
    <header>
        <div class="profile-box">
            <div class="profile-onlinestatus-div">
                <div class="user-info-container">
                    <img class="profile-picture" src="images/nooru.jpeg" alt="User">
                    <div class="signintext-profilename-div">
                        <p class="sign-in-text">Signed In</p> 
                        <strong class="profile-name js-header-profile-name">NOORUDHEEN SAQAFI</strong>
                    </div>
                </div>            
                <div class="online-text-div">
                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-wifi" aria-hidden="true"><path d="M12 20h.01"></path><path d="M2 8.82a15 15 0 0 1 20 0"></path><path d="M5 12.859a10 10 0 0 1 14 0"></path><path d="M8.5 16.429a5 5 0 0 1 7 0"></path></svg>
                    <p class="online-text">Online</p>
                </div>
            </div>
        </div>
        
        <p class="hajar-title">Hajar</p>
        <div class="top-nav-buttons-container">
            <button class="top-nav-buttons js-attendence-navbutton active">Attendance</button>
            <button class="top-nav-buttons js-reports-navbutton">Reports</button>
            <button class="top-nav-buttons js-settings-navbutton">Settings</button>
        </div>
    </header>

<!-- Main App Body -->
    <main>
        <div style="padding: 60px 20px; text-align: center; color: var(--text-muted, #666);">
            <p style="font-size: 15px;">Loading attendance from database...</p>
        </div>
    </main>

<!-- Bottom Navbar -->
    <footer>
        <div class="bottom-navbar-container">
            <button class="bottom-nav-button js-students-navbutton">
                <svg class="bottom-navbar-svg" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-plus" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" x2="19" y1="8" y2="14"></line><line x1="22" x2="16" y1="11" y2="11"></line></svg>
                <p>Students</p>
            </button>
            <button class="bottom-nav-button js-teachers-navbutton">
                <svg class="bottom-navbar-svg" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-users" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><path d="M16 3.128a4 4 0 0 1 0 7.744"></path><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><circle cx="9" cy="7" r="4"></circle></svg>
                <p>Teachers</p>
            </button>
            <button class="bottom-nav-button js-classes-navbutton">
                <svg class="bottom-navbar-svg" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-layout-grid" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="14" rx="1"></rect><rect width="7" height="7" x="3" y="14" rx="1"></rect></svg>
                <p>Classes</p>
            </button>
            <button class="bottom-nav-button js-subjects-navbutton">
                <svg class="bottom-navbar-svg" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-book-open" aria-hidden="true"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg>
                <p>Subjects</p>
            </button>      
        </div>
    </footer>

    <script type="module" src="./scripts/mainscript.js"></script>
</body>
</html>
